name: Build TEKSHER HUB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Validate TN VED spreadsheet catalogue
        run: node scripts/check-tnved-catalog.mjs
      - name: Validate AI evaluation runner syntax
        run: node --check scripts/evaluate-ai-golden-set.mjs

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teksher_hub
          POSTGRES_USER: teksher
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teksher -d teksher_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install OCR engine and language data
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus tesseract-ocr-kir
      - name: Compile backend
        run: mvn -B -f backend/pom.xml clean verify
      - name: Start API and smoke-test schema, login and documents
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/teksher_hub
          DATABASE_USERNAME: teksher
          DATABASE_PASSWORD: ci-test-password
          JWT_SECRET: CI-only-secret-that-is-at-least-thirty-two-bytes
          BOOTSTRAP_ADMIN_USERNAME: ci-admin
          BOOTSTRAP_ADMIN_PASSWORD: ci-password-strong-enough-123
          APP_CORS_ORIGINS: http://localhost:5173
          UPLOAD_DIR: /tmp/teksher-hub-uploads
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          java -jar backend/target/teksher-hub-api-1.0.0.jar > /tmp/teksher-hub-api.log 2>&1 &
          echo $! > /tmp/teksher-hub-api.pid
          for i in {1..60}; do
            if curl --silent --fail http://localhost:8080/api/health > /tmp/teksher-hub-health.json; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail http://localhost:8080/api/health; then
            cat /tmp/teksher-hub-api.log
            exit 1
          fi
          LOGIN=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"ci-password-strong-enough-123"}')
          TOKEN=$(echo "$LOGIN" | jq -r '.token')
          test -n "$TOKEN" && test "$TOKEN" != "null"

          AI_GREETING=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/ai/ask -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"question":"привет"}')
          echo "$AI_GREETING" | jq -e '.answer | contains("TEKSHER AI")'
          AI_IDENTITY=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/ai/ask -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"question":"кто тебя создал"}')
          echo "$AI_IDENTITY" | jq -e '.answer | contains("самый красивый сотрудник оператора маркировки") and contains("развивает TEKSHER HUB")'
          if [ -n "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is configured; running live AI golden-set evaluation."
            TEKSHER_API_BASE_URL=http://localhost:8080 TEKSHER_API_TOKEN="$TOKEN" node scripts/evaluate-ai-golden-set.mjs
          else
            echo "Skipping live AI golden-set evaluation: repository secret GROQ_API_KEY is not configured."
          fi


          FEEDBACK=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/ai/feedback -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"rating":"negative","category":"incorrect","question":"CI feedback question","answer":"CI feedback answer","sourceTitles":["CI source"]}')
          echo "$FEEDBACK" | jq -e '.received == true and .id != null'
          FEEDBACK_SUMMARY=$(curl --silent --show-error --fail http://localhost:8080/api/ai/feedback/summary -H "Authorization: Bearer $TOKEN")
          echo "$FEEDBACK_SUMMARY" | jq -e '.total >= 1 and .negative >= 1 and .positiveRate >= 0 and any(.negativeCategories[]; .category == "incorrect" and .count >= 1) and any(.recentNegative[]; .question == "CI feedback question" and .answer == "CI feedback answer" and .category == "incorrect" and (.sourceTitles | contains("CI source")))'

          PROCESS_GUIDES=$(curl --silent --show-error --fail "http://localhost:8080/api/business-processes" -H "Authorization: Bearer $TOKEN")
          echo "$PROCESS_GUIDES" | jq -e 'length == 6 and any(.[]; .id == "registration" and (.steps | length) == 5)'
          PROCESS_CREATED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/business-processes" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"category":"CI","title":"CI business process guide","summary":"Temporary process for CRUD smoke test","scope":"CI","time":"1 step","searchTerm":"CI process","sources":[],"steps":[{"title":"Initial step","detail":"Initial detail"}]}')
          PROCESS_ID=$(echo "$PROCESS_CREATED" | jq -r '.id')
          test -n "$PROCESS_ID" && test "$PROCESS_ID" != "null"
          PROCESS_UPDATE_BODY=$(echo "$PROCESS_CREATED" | jq -c '.summary = "Updated by CI" | {category,title,summary,scope,time,searchTerm,sources,steps,orderIndex}')
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/business-processes/$PROCESS_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$PROCESS_UPDATE_BODY" | jq -e '.summary == "Updated by CI"'
          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/business-processes/$PROCESS_ID" -H "Authorization: Bearer $TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/business-processes" -H "Authorization: Bearer $TOKEN" | jq -e 'length == 6'
          CREATED=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/documents -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"CI smoke test document","jurisdiction":"KG","kind":"Нормативный акт","area":"CI","documentNumber":"CI-001","documentDate":"2026-01-01","effectiveFrom":"2026-01-01","effectiveUntil":"2027-01-01","sourceUrl":"https://minjust.gov.kg/","description":"Temporary record to validate database migration and REST API","status":"","changeNote":"CI smoke test"}')
          DOC_ID=$(echo "$CREATED" | jq -r '.id')
          test -n "$DOC_ID" && test "$DOC_ID" != "null"
          curl --silent --show-error --fail "http://localhost:8080/api/documents/$DOC_ID/versions" -H "Authorization: Bearer $TOKEN" | jq -e 'length == 1'
          curl --silent --show-error --fail "http://localhost:8080/api/documents" -H "Authorization: Bearer $TOKEN" | jq -e --arg title "CI smoke test document" 'any(.[]; .title == $title)'
          printf '%s\n' 'attachment-search-marker-unique-9876' > /tmp/ci-attachment.txt
          UPLOADED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/documents/$DOC_ID/files" -H "Authorization: Bearer $TOKEN" -F "file=@/tmp/ci-attachment.txt;type=text/plain")
          echo "$UPLOADED" | jq -e '.textExtractionStatus == "INDEXED" and .extractedCharacters > 0'
          FILE_ID=$(printf '%s' "$UPLOADED" | jq -r '.id')
          REINDEXED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/documents/$DOC_ID/files/$FILE_ID/reindex" -H "Authorization: Bearer $TOKEN")
          echo "$REINDEXED" | jq -e '.textExtractionStatus == "INDEXED" and .extractedCharacters > 0'
          curl --silent --show-error --fail "http://localhost:8080/api/documents?q=attachment-search-marker-unique-9876" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" 'any(.[]; .id == $id and .matchedInAttachment == true)'
          BATCH=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/admin/attachments/reindex-unindexed?limit=5" -H "Authorization: Bearer $TOKEN")
          echo "$BATCH" | jq -e '.processed >= 0 and .remainingUnindexed >= 0 and (.files | type == "array")'
          IMPORTED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/documents/import" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"documents":[{"title":"CI imported document","jurisdiction":"KG","kind":"Инструкция","area":"CI","productGroup":null,"keywords":null,"relatedDocumentIds":[],"documentNumber":null,"documentDate":"2026-01-01","effectiveFrom":null,"effectiveUntil":null,"sourceUrl":"https://www.gov.kg/","description":"Valid row for import smoke test","content":"Imported content","status":"ACTIVE","changeNote":"CI CSV import"},{"title":"","jurisdiction":"KG","kind":"Инструкция","area":"CI","description":"Invalid row for import smoke test","status":""}]}')
          echo "$IMPORTED" | jq -e '.imported == 1 and .rejected == 1 and .rows[0].statusLabel == "На проверке" and .rows[1].imported == false'
          curl --silent --show-error --fail "http://localhost:8080/api/documents/export.csv" -H "Authorization: Bearer $TOKEN" -o /tmp/teksher-hub-export.csv
          grep -q 'CI imported document' /tmp/teksher-hub-export.csv
          grep -q 'Содержание' /tmp/teksher-hub-export.csv

          RELATED=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/documents -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"CI related deletion test document","jurisdiction":"KG","kind":"Инструкция","area":"CI delete","description":"Temporary linked record for delete regression test","content":"Linked document smoke test","sourceUrl":"https://www.gov.kg/","status":"","changeNote":"CI delete regression test"}')
          RELATED_ID=$(echo "$RELATED" | jq -r '.id')
          test -n "$RELATED_ID" && test "$RELATED_ID" != "null"

          LINKED_BODY=$(curl --silent --show-error --fail "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $TOKEN" | jq --arg related "$RELATED_ID" '{title,jurisdiction,kind,area,productGroup,keywords,relatedDocumentIds:[$related],documentNumber,documentDate,effectiveFrom,effectiveUntil,sourceUrl,description,content,status,changeNote:"CI deletion linked-doc regression test"}')
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$LINKED_BODY" | jq -e --arg related "$RELATED_ID" '(.relatedDocumentIds | index($related)) != null'

          RELATED_BODY=$(curl --silent --show-error --fail "http://localhost:8080/api/documents/$RELATED_ID" -H "Authorization: Bearer $TOKEN" | jq --arg target "$DOC_ID" '{title,jurisdiction,kind,area,productGroup,keywords,relatedDocumentIds:[$target],documentNumber,documentDate,effectiveFrom,effectiveUntil,sourceUrl,description,content,status,changeNote:"CI deletion inbound-link regression test"}')
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/documents/$RELATED_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$RELATED_BODY" | jq -e --arg target "$DOC_ID" '(.relatedDocumentIds | index($target)) != null'

          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/documents/$RELATED_ID" -H "Authorization: Bearer $TOKEN" | jq -e '.relatedDocumentIds == []'
          curl --silent --show-error --fail "http://localhost:8080/api/documents" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" 'all(.[]; .id != $id)'
          curl --silent --show-error --fail "http://localhost:8080/api/documents?q=attachment-search-marker-unique-9876" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" 'all(.[]; .id != $id)'

          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/documents/$RELATED_ID" -H "Authorization: Bearer $TOKEN"
          kill "$(cat /tmp/teksher-hub-api.pid)" || true
      - name: Upload AI golden-set evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-golden-set-report
          path: backend/target/ai-golden-results.json
          if-no-files-found: ignore

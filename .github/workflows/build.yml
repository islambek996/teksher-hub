name: Build TEKSHER HUB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Validate TN VED spreadsheet catalogue
        run: node scripts/check-tnved-catalog.mjs
      - name: Validate AI evaluation runner syntax
        run: node --check scripts/evaluate-ai-golden-set.mjs
      - name: Validate backup and restore scripts
        run: bash -n scripts/backup-teksher-hub.sh scripts/restore-teksher-hub.sh
      - name: Test uploads archive validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teksher_hub
          POSTGRES_USER: teksher
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teksher -d teksher_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install OCR engine and language data
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus tesseract-ocr-kir
      - name: Compile backend
        run: mvn -B -f backend/pom.xml clean verify
      - name: Start API and smoke-test schema, login and documents
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/teksher_hub
          DATABASE_USERNAME: teksher
          DATABASE_PASSWORD: ci-test-password
          JWT_SECRET: CI-only-secret-that-is-at-least-thirty-two-bytes
          BOOTSTRAP_ADMIN_USERNAME: ci-admin
          BOOTSTRAP_ADMIN_PASSWORD: ci-password-strong-enough-123
          APP_CORS_ORIGINS: http://localhost:5173
          UPLOAD_DIR: /tmp/teksher-hub-uploads
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          java -jar backend/target/teksher-hub-api-1.0.0.jar > /tmp/teksher-hub-api.log 2>&1 &
          echo $! > /tmp/teksher-hub-api.pid
          for i in {1..60}; do
            if curl --silent --fail http://localhost:8080/api/health > /tmp/teksher-hub-health.json; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail http://localhost:8080/api/health; then
            cat /tmp/teksher-hub-api.log
            exit 1
          fi
          LOGIN=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"ci-password-strong-enough-123"}')
          TOKEN=$(echo "$LOGIN" | jq -r '.token')
          test -n "$TOKEN" && test "$TOKEN" != "null"

          AI_GREETING=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/ai/ask -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"question":"привет"}')
          echo "$AI_GREETING" | jq -e '.answer | contains("TEKSHER AI")'
          AI_IDENTITY=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/ai/ask -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"question":"кто тебя создал"}')
          echo "$AI_IDENTITY" | jq -e '.answer | contains("самый красивый сотрудник оператора маркировки") and contains("развивает TEKSHER HUB")'
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$GROQ_API_KEY" ]; then
            echo "Manual workflow dispatch and GROQ_API_KEY are configured; running live AI golden-set evaluation."
            TEKSHER_API_BASE_URL=http://localhost:8080 TEKSHER_API_TOKEN="$TOKEN" node scripts/evaluate-ai-golden-set.mjs
          else
            echo "Skipping live AI golden-set evaluation during normal CI. Run this workflow manually to evaluate live Groq responses."
          fi


          FEEDBACK=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/ai/feedback -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"rating":"negative","category":"incorrect","question":"CI feedback question","answer":"CI feedback answer","sourceTitles":["CI source"]}')
          echo "$FEEDBACK" | jq -e '.received == true and .id != null'
          FEEDBACK_SUMMARY=$(curl --silent --show-error --fail http://localhost:8080/api/ai/feedback/summary -H "Authorization: Bearer $TOKEN")
          echo "$FEEDBACK_SUMMARY" | jq -e '.total >= 1 and .negative >= 1 and .positiveRate >= 0 and any(.negativeCategories[]; .category == "incorrect" and .count >= 1) and any(.recentNegative[]; .question == "CI feedback question" and .answer == "CI feedback answer" and .category == "incorrect" and (.sourceTitles | contains("CI source")))'

          PROCESS_GUIDES=$(curl --silent --show-error --fail "http://localhost:8080/api/business-processes" -H "Authorization: Bearer $TOKEN")
          echo "$PROCESS_GUIDES" | jq -e 'length == 6 and any(.[]; .id == "registration" and (.steps | length) == 5)'
          PROCESS_CREATED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/business-processes" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"category":"CI","title":"CI business process guide","summary":"Temporary process for CRUD smoke test","scope":"CI","time":"1 step","searchTerm":"CI process","sources":[],"steps":[{"title":"Initial step","detail":"Initial detail"},{"title":"Second step","detail":"Second detail"},{"title":"Third step","detail":"Third detail"}]}')
          PROCESS_ID=$(echo "$PROCESS_CREATED" | jq -r '.id')
          test -n "$PROCESS_ID" && test "$PROCESS_ID" != "null"
          PROCESS_UPDATE_BODY=$(echo "$PROCESS_CREATED" | jq -c '.summary = "Updated by CI" | {category,title,summary,scope,time,searchTerm,sources,steps,orderIndex}')
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/business-processes/$PROCESS_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$PROCESS_UPDATE_BODY" | jq -e '.summary == "Updated by CI"'
          curl --silent --show-error --fail "http://localhost:8080/api/business-processes/$PROCESS_ID/versions" -H "Authorization: Bearer $TOKEN" | jq -e 'length == 2 and .[0].action == "UPDATE"'
          curl --silent --show-error --fail -X POST "http://localhost:8080/api/business-processes/$PROCESS_ID/versions/1/restore" -H "Authorization: Bearer $TOKEN" | jq -e '.summary == "Temporary process for CRUD smoke test"'
          curl --silent --show-error --fail "http://localhost:8080/api/business-processes/$PROCESS_ID/versions" -H "Authorization: Bearer $TOKEN" | jq -e 'length == 3 and .[0].action == "RESTORE"'

          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/business-process-progress/$PROCESS_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '["0","2"]' | jq -e '.saved == true and (.completedSteps | length) == 2'
          curl --silent --show-error --fail "http://localhost:8080/api/business-process-progress" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$PROCESS_ID" '.[$id] == ["0","2"]'
          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/business-process-progress/$PROCESS_ID" -H "Authorization: Bearer $TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/business-process-progress" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$PROCESS_ID" 'has($id) | not'

          TASK_CREATED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/tasks" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"CI team task","description":"Task API smoke test","status":"TODO","priority":"HIGH","dueDate":"2026-12-01","assignedTo":"ci-admin"}')
          TASK_ID=$(echo "$TASK_CREATED" | jq -r '.id')
          test -n "$TASK_ID" && test "$TASK_ID" != "null"
          echo "$TASK_CREATED" | jq -e '.title == "CI team task" and .assignedTo == "ci-admin" and .priority == "HIGH"'
          curl --silent --show-error --fail -X PATCH "http://localhost:8080/api/tasks/$TASK_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"IN_PROGRESS"}' | jq -e '.status == "IN_PROGRESS"'
          curl --silent --show-error --fail "http://localhost:8080/api/tasks" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$TASK_ID" 'any(.[]; (.id | tostring) == $id and .status == "IN_PROGRESS")'

          EDITOR_CREATED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/users" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"username":"ci-editor","displayName":"CI Editor","password":"ci-password-strong-enough-456","role":"EDITOR"}')
          EDITOR_USER_ID=$(echo "$EDITOR_CREATED" | jq -r '.id')
          test -n "$EDITOR_USER_ID" && test "$EDITOR_USER_ID" != "null"
          EDITOR_LOGIN=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-editor","password":"ci-password-strong-enough-456"}')
          EDITOR_TOKEN=$(echo "$EDITOR_LOGIN" | jq -r '.token')
          test -n "$EDITOR_TOKEN" && test "$EDITOR_TOKEN" != "null"
          EDITOR_USERS_STATUS=$(curl --silent --output /tmp/ci-editor-users.json --write-out '%{http_code}' "http://localhost:8080/api/users" -H "Authorization: Bearer $EDITOR_TOKEN")
          test "$EDITOR_USERS_STATUS" = "403"

          READER_CREATED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/users" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"username":"ci-reader","displayName":"CI Reader","password":"ci-password-strong-enough-789","role":"READER"}')
          READER_USER_ID=$(echo "$READER_CREATED" | jq -r '.id')
          test -n "$READER_USER_ID" && test "$READER_USER_ID" != "null"
          READER_LOGIN=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-reader","password":"ci-password-strong-enough-789"}')
          READER_TOKEN=$(echo "$READER_LOGIN" | jq -r '.token')
          test -n "$READER_TOKEN" && test "$READER_TOKEN" != "null"

          OLD_READER_TOKEN="$READER_TOKEN"
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/users/$READER_USER_ID/password" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"password":"ci-password-rotated-987654"}' | jq -e '.username == "ci-reader"'
          OLD_TOKEN_STATUS=$(curl --silent --output /tmp/ci-old-token-after-password-reset.json --write-out '%{http_code}' "http://localhost:8080/api/auth/me" -H "Authorization: Bearer $OLD_READER_TOKEN")
          test "$OLD_TOKEN_STATUS" != "200"
          READER_LOGIN=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-reader","password":"ci-password-rotated-987654"}')
          READER_TOKEN=$(echo "$READER_LOGIN" | jq -r '.token')
          test -n "$READER_TOKEN" && test "$READER_TOKEN" != "null"
          OLD_READER_TOKEN="$READER_TOKEN"
          curl --silent --show-error --fail -X PATCH "http://localhost:8080/api/users/$READER_USER_ID/enabled" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"enabled":false}' | jq -e '.enabled == false'
          DISABLED_TOKEN_STATUS=$(curl --silent --output /tmp/ci-disabled-token.json --write-out '%{http_code}' "http://localhost:8080/api/auth/me" -H "Authorization: Bearer $OLD_READER_TOKEN")
          test "$DISABLED_TOKEN_STATUS" != "200"
          curl --silent --show-error --fail -X PATCH "http://localhost:8080/api/users/$READER_USER_ID/enabled" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"enabled":true}' | jq -e '.enabled == true'
          REENABLED_OLD_TOKEN_STATUS=$(curl --silent --output /tmp/ci-reenabled-old-token.json --write-out '%{http_code}' "http://localhost:8080/api/auth/me" -H "Authorization: Bearer $OLD_READER_TOKEN")
          test "$REENABLED_OLD_TOKEN_STATUS" != "200"
          READER_LOGIN=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-reader","password":"ci-password-rotated-987654"}')
          READER_TOKEN=$(echo "$READER_LOGIN" | jq -r '.token')
          test -n "$READER_TOKEN" && test "$READER_TOKEN" != "null"

          curl --silent --show-error --fail "http://localhost:8080/api/business-processes" -H "Authorization: Bearer $READER_TOKEN" | jq -e --arg id "$PROCESS_ID" 'all(.[]; .id != $id)'
          curl --silent --show-error --fail -X POST "http://localhost:8080/api/business-processes/$PROCESS_ID/submit-for-review" -H "Authorization: Bearer $EDITOR_TOKEN" | jq -e '.workflowStatus == "IN_REVIEW"'
          EDITOR_PUBLISH_STATUS=$(curl --silent --output /tmp/ci-editor-publish.json --write-out '%{http_code}' -X POST "http://localhost:8080/api/business-processes/$PROCESS_ID/publish" -H "Authorization: Bearer $EDITOR_TOKEN")
          test "$EDITOR_PUBLISH_STATUS" = "403"
          curl --silent --show-error --fail -X POST "http://localhost:8080/api/business-processes/$PROCESS_ID/publish" -H "Authorization: Bearer $TOKEN" | jq -e '.workflowStatus == "PUBLISHED"'
          curl --silent --show-error --fail "http://localhost:8080/api/business-processes" -H "Authorization: Bearer $READER_TOKEN" | jq -e --arg id "$PROCESS_ID" 'any(.[]; .id == $id and .workflowStatus == "PUBLISHED")'
          curl --silent --show-error --fail "http://localhost:8080/api/business-processes/$PROCESS_ID/versions" -H "Authorization: Bearer $READER_TOKEN" | jq -e 'length == 1 and .[0].workflowStatus == "PUBLISHED"'
          READER_OLD_VERSION_STATUS=$(curl --silent --output /tmp/ci-reader-old-version.json --write-out '%{http_code}' "http://localhost:8080/api/business-processes/$PROCESS_ID/versions/1" -H "Authorization: Bearer $READER_TOKEN")
          test "$READER_OLD_VERSION_STATUS" = "403"
          curl --silent --show-error --fail -X POST "http://localhost:8080/api/business-process-progress/$PROCESS_ID/start" -H "Authorization: Bearer $READER_TOKEN" | jq -e '.started == true'
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/business-process-progress/$PROCESS_ID" -H "Authorization: Bearer $READER_TOKEN" -H 'Content-Type: application/json' -d '["0"]' | jq -e '.saved == true and .completedSteps == ["0"]'
          curl --silent --show-error --fail -X POST "http://localhost:8080/api/business-process-progress/$PROCESS_ID/complete" -H "Authorization: Bearer $READER_TOKEN" | jq -e '.completed == true'
          curl --silent --show-error --fail "http://localhost:8080/api/business-processes/overview" -H "Authorization: Bearer $EDITOR_TOKEN" | jq -e --arg id "$PROCESS_ID" 'any(.executions[]; .processId == $id and .username == "ci-reader" and .executionStatus == "COMPLETED" and .completedSteps == 1)'


          ASSIGNED_TASK=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/tasks" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"CI task with comments","description":"Validate assignment notifications and task comments","status":"TODO","priority":"NORMAL","dueDate":"2026-12-05","assignedTo":"ci-editor"}')
          ASSIGNED_TASK_ID=$(echo "$ASSIGNED_TASK" | jq -r '.id')
          test -n "$ASSIGNED_TASK_ID" && test "$ASSIGNED_TASK_ID" != "null"
          curl --silent --show-error --fail "http://localhost:8080/api/notifications" -H "Authorization: Bearer $EDITOR_TOKEN" | jq -e --argjson id "$ASSIGNED_TASK_ID" 'any(.[]; .taskId == $id and .title == "Новое поручение" and .readAt == null)'

          COMMENT=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/tasks/$ASSIGNED_TASK_ID/comments" -H "Authorization: Bearer $EDITOR_TOKEN" -H 'Content-Type: application/json' -d '{"body":"CI comment verifies task discussion."}')
          echo "$COMMENT" | jq -e --argjson id "$ASSIGNED_TASK_ID" '.taskId == $id and .body == "CI comment verifies task discussion."'
          curl --silent --show-error --fail "http://localhost:8080/api/tasks/$ASSIGNED_TASK_ID/comments" -H "Authorization: Bearer $EDITOR_TOKEN" | jq -e --argjson id "$ASSIGNED_TASK_ID" 'length == 1 and .[0].taskId == $id'
          curl --silent --show-error --fail "http://localhost:8080/api/notifications" -H "Authorization: Bearer $TOKEN" | jq -e --argjson id "$ASSIGNED_TASK_ID" 'any(.[]; .taskId == $id and .title == "Новый комментарий к задаче" and .readAt == null)'
          curl --silent --show-error --fail -X POST "http://localhost:8080/api/notifications/read-all" -H "Authorization: Bearer $TOKEN" | cat
          curl --silent --show-error --fail "http://localhost:8080/api/notifications" -H "Authorization: Bearer $TOKEN" | jq -e 'all(.[]; .readAt != null)'
          curl --silent --show-error --fail -X PATCH "http://localhost:8080/api/notifications/$(curl --silent --show-error --fail "http://localhost:8080/api/notifications" -H "Authorization: Bearer $EDITOR_TOKEN" | jq -r --argjson id "$ASSIGNED_TASK_ID" '.[] | select(.taskId == $id and .title == "Новое поручение") | .id' | head -n 1)/read" -H "Authorization: Bearer $EDITOR_TOKEN"
          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/tasks/$ASSIGNED_TASK_ID" -H "Authorization: Bearer $TOKEN"

          MONITOR_CREATED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/monitors" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"name":"CI source monitor","jurisdiction":"KG","sourceUrl":"https://minjust.gov.kg/","enabled":false,"intervalHours":24}')
          MONITOR_ID=$(echo "$MONITOR_CREATED" | jq -r '.id')
          test -n "$MONITOR_ID" && test "$MONITOR_ID" != "null"
          echo "$MONITOR_CREATED" | jq -e '.name == "CI source monitor" and .enabled == false'
          curl --silent --show-error --fail "http://localhost:8080/api/audit-log?limit=250" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$MONITOR_ID" 'any(.[]; .entityType == "SOURCE_MONITOR" and .entityId == $id and .action == "CREATE")'
          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/monitors/$MONITOR_ID" -H "Authorization: Bearer $TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/audit-log?limit=250" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$MONITOR_ID" 'any(.[]; .entityType == "SOURCE_MONITOR" and .entityId == $id and .action == "DELETE")'

          curl --silent --show-error --fail "http://localhost:8080/api/audit-log?limit=250" -H "Authorization: Bearer $TOKEN" | jq -e --arg processId "$PROCESS_ID" --arg taskId "$TASK_ID" 'any(.[]; .entityType == "BUSINESS_PROCESS" and .entityId == $processId and .action == "RESTORE") and any(.[]; .entityType == "TASK" and .entityId == $taskId and .action == "CREATE")'
          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/tasks/$TASK_ID" -H "Authorization: Bearer $TOKEN"
          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/business-processes/$PROCESS_ID" -H "Authorization: Bearer $TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/business-processes" -H "Authorization: Bearer $TOKEN" | jq -e 'length == 6'
          CREATED=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/documents -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"CI smoke test document","jurisdiction":"KG","kind":"Нормативный акт","area":"CI","documentNumber":"CI-001","documentDate":"2026-01-01","effectiveFrom":"2026-01-01","effectiveUntil":"2027-01-01","sourceUrl":"https://minjust.gov.kg/","description":"Temporary record to validate database migration and REST API","status":"ACTIVE","changeNote":"CI smoke test"}')
          DOC_ID=$(echo "$CREATED" | jq -r '.id')
          test -n "$DOC_ID" && test "$DOC_ID" != "null"
          echo "$CREATED" | jq -e '.status == "UNDER_REVIEW"'
          DIRECT_ACTIVATION_BODY=$(curl --silent --show-error --fail "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $TOKEN" | jq '.status = "ACTIVE" | {title,jurisdiction,kind,area,productGroup,keywords,relatedDocumentIds,documentNumber,documentDate,effectiveFrom,effectiveUntil,sourceUrl,description,content,status,changeNote:"CI must reject direct status changes"}')
          DIRECT_ACTIVATION_STATUS=$(curl --silent --output /tmp/ci-direct-document-activation.json --write-out '%{http_code}' -X PUT "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$DIRECT_ACTIVATION_BODY")
          test "$DIRECT_ACTIVATION_STATUS" = "400"
          EDITOR_DELETE_STATUS=$(curl --silent --output /tmp/ci-editor-delete.json --write-out '%{http_code}' -X DELETE "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $EDITOR_TOKEN")
          test "$EDITOR_DELETE_STATUS" = "403"
          curl --silent --show-error --fail "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" '.id == $id'
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/favorites/$DOC_ID" -H "Authorization: Bearer $TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/favorites" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" 'index($id) != null'
          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/favorites/$DOC_ID" -H "Authorization: Bearer $TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/favorites" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" 'index($id) == null'
          curl --silent --show-error --fail "http://localhost:8080/api/documents/$DOC_ID/versions" -H "Authorization: Bearer $TOKEN" | jq -e 'length == 1'

          READER_DRAFT_DOCUMENT_STATUS=$(curl --silent --output /tmp/ci-reader-draft-document.json --write-out '%{http_code}' "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $READER_TOKEN")
          test "$READER_DRAFT_DOCUMENT_STATUS" = "404"
          READER_DRAFT_FAVORITE_STATUS=$(curl --silent --output /tmp/ci-reader-draft-favorite.json --write-out '%{http_code}' -X PUT "http://localhost:8080/api/favorites/$DOC_ID" -H "Authorization: Bearer $READER_TOKEN")
          test "$READER_DRAFT_FAVORITE_STATUS" = "404"
          curl --silent --show-error --fail "http://localhost:8080/api/favorites" -H "Authorization: Bearer $READER_TOKEN" | jq -e --arg id "$DOC_ID" 'index($id) == null'
          MISSING_DOCUMENT_STATUS=$(curl --silent --output /tmp/ci-missing-document.json --write-out '%{http_code}' "http://localhost:8080/api/documents/00000000-0000-0000-0000-000000000000" -H "Authorization: Bearer $READER_TOKEN")
          test "$MISSING_DOCUMENT_STATUS" = "404"
          curl --silent --show-error --fail -X POST "http://localhost:8080/api/documents/$DOC_ID/review" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"ACTIVE","note":"CI confirms reader visibility only after publication"}' | jq -e '.status == "ACTIVE"'
          curl --silent --show-error --fail "http://localhost:8080/api/documents/$DOC_ID/versions" -H "Authorization: Bearer $READER_TOKEN" | jq -e 'length == 1 and .[0].status == "ACTIVE"'
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/favorites/$DOC_ID" -H "Authorization: Bearer $READER_TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/favorites" -H "Authorization: Bearer $READER_TOKEN" | jq -e --arg id "$DOC_ID" 'index($id) != null'
          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/favorites/$DOC_ID" -H "Authorization: Bearer $READER_TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/audit-log?limit=250" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" 'any(.[]; .entityType == "DOCUMENT" and .entityId == $id and .action == "CREATE")'
          curl --silent --show-error --fail "http://localhost:8080/api/documents" -H "Authorization: Bearer $TOKEN" | jq -e --arg title "CI smoke test document" 'any(.[]; .title == $title)'
          printf '%s\n' 'attachment-search-marker-unique-9876' > /tmp/ci-attachment.txt
          UPLOADED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/documents/$DOC_ID/files" -H "Authorization: Bearer $TOKEN" -F "file=@/tmp/ci-attachment.txt;type=text/plain")
          echo "$UPLOADED" | jq -e '.textExtractionStatus == "INDEXED" and .extractedCharacters > 0'
          FILE_ID=$(printf '%s' "$UPLOADED" | jq -r '.id')
          REINDEXED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/documents/$DOC_ID/files/$FILE_ID/reindex" -H "Authorization: Bearer $TOKEN")
          echo "$REINDEXED" | jq -e '.textExtractionStatus == "INDEXED" and .extractedCharacters > 0'
          curl --silent --show-error --fail "http://localhost:8080/api/documents?q=attachment-search-marker-unique-9876" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" 'any(.[]; .id == $id and .matchedInAttachment == true)'
          BATCH=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/admin/attachments/reindex-unindexed?limit=5" -H "Authorization: Bearer $TOKEN")
          echo "$BATCH" | jq -e '.processed >= 0 and .remainingUnindexed >= 0 and (.files | type == "array")'
          IMPORTED=$(curl --silent --show-error --fail -X POST "http://localhost:8080/api/documents/import" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"documents":[{"title":"CI imported document","jurisdiction":"KG","kind":"Инструкция","area":"CI","productGroup":null,"keywords":null,"relatedDocumentIds":[],"documentNumber":null,"documentDate":"2026-01-01","effectiveFrom":null,"effectiveUntil":null,"sourceUrl":"https://www.gov.kg/","description":"Valid row for import smoke test","content":"Imported content","status":"ACTIVE","changeNote":"CI CSV import"},{"title":"","jurisdiction":"KG","kind":"Инструкция","area":"CI","description":"Invalid row for import smoke test","status":""}]}')
          echo "$IMPORTED" | jq -e '.imported == 1 and .rejected == 1 and .rows[0].statusLabel == "На проверке" and .rows[1].imported == false'
          curl --silent --show-error --fail "http://localhost:8080/api/documents/export.csv" -H "Authorization: Bearer $TOKEN" -o /tmp/teksher-hub-export.csv
          grep -q 'CI imported document' /tmp/teksher-hub-export.csv
          grep -q 'Содержание' /tmp/teksher-hub-export.csv

          RELATED=$(curl --silent --show-error --fail -X POST http://localhost:8080/api/documents -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"CI related deletion test document","jurisdiction":"KG","kind":"Инструкция","area":"CI delete","description":"Temporary linked record for delete regression test","content":"Linked document smoke test","sourceUrl":"https://www.gov.kg/","status":"","changeNote":"CI delete regression test"}')
          RELATED_ID=$(echo "$RELATED" | jq -r '.id')
          test -n "$RELATED_ID" && test "$RELATED_ID" != "null"

          LINKED_BODY=$(curl --silent --show-error --fail "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $TOKEN" | jq --arg related "$RELATED_ID" '{title,jurisdiction,kind,area,productGroup,keywords,relatedDocumentIds:[$related],documentNumber,documentDate,effectiveFrom,effectiveUntil,sourceUrl,description,content,status,changeNote:"CI deletion linked-doc regression test"}')
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$LINKED_BODY" | jq -e --arg related "$RELATED_ID" '(.relatedDocumentIds | index($related)) != null and .status == "UNDER_REVIEW"'
          READER_AFTER_EDIT_STATUS=$(curl --silent --output /tmp/ci-reader-edited-document.json --write-out '%{http_code}' "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $READER_TOKEN")
          test "$READER_AFTER_EDIT_STATUS" = "404"
          curl --silent --show-error --fail -X POST "http://localhost:8080/api/documents/$DOC_ID/review" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"ACTIVE","note":"CI rechecks document after content/link edits"}' | jq -e '.status == "ACTIVE"'
          curl --silent --show-error --fail "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $READER_TOKEN" | jq -e '.relatedDocumentIds == []'

          RELATED_BODY=$(curl --silent --show-error --fail "http://localhost:8080/api/documents/$RELATED_ID" -H "Authorization: Bearer $TOKEN" | jq --arg target "$DOC_ID" '{title,jurisdiction,kind,area,productGroup,keywords,relatedDocumentIds:[$target],documentNumber,documentDate,effectiveFrom,effectiveUntil,sourceUrl,description,content,status,changeNote:"CI deletion inbound-link regression test"}')
          curl --silent --show-error --fail -X PUT "http://localhost:8080/api/documents/$RELATED_ID" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$RELATED_BODY" | jq -e --arg target "$DOC_ID" '(.relatedDocumentIds | index($target)) != null'

          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/documents/$DOC_ID" -H "Authorization: Bearer $TOKEN"
          curl --silent --show-error --fail "http://localhost:8080/api/documents/$RELATED_ID" -H "Authorization: Bearer $TOKEN" | jq -e '.relatedDocumentIds == []'
          curl --silent --show-error --fail "http://localhost:8080/api/documents" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" 'all(.[]; .id != $id)'
          curl --silent --show-error --fail "http://localhost:8080/api/documents?q=attachment-search-marker-unique-9876" -H "Authorization: Bearer $TOKEN" | jq -e --arg id "$DOC_ID" 'all(.[]; .id != $id)'

          curl --silent --show-error --fail -X DELETE "http://localhost:8080/api/documents/$RELATED_ID" -H "Authorization: Bearer $TOKEN"
          kill "$(cat /tmp/teksher-hub-api.pid)" || true
      - name: Upload AI golden-set evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-golden-set-report
          path: backend/target/ai-golden-results.json
          if-no-files-found: ignore
